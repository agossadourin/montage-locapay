name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Dépendances
        run: pip install -r requirements/dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Scripts shell valides
        run: |
          bash -n Installer.command
          bash -n "Mettre à jour.command"
          bash -n "Lancer Raccord.command"
          bash -n "Creer l'app Raccord.command"
          bash -n macos/build_app.sh
          bash -n "Installer IA locale (Ollama).command"
